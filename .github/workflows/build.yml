name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  vita:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v5
      - name: Install SDL2
        run: |
          [ -f "$VITASDK/arm-vita-eabi/lib/libSDL2.a" ] || vdpm sdl2
      - name: Build
        run: |
          cmake -S . -B build-vita -DCMAKE_TOOLCHAIN_FILE=$VITASDK/share/vita.toolchain.cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build-vita -j$(nproc)
      - uses: actions/upload-artifact@v5
        with:
          name: HoverVita-vpk
          path: build-vita/HoverVita.vpk

  pc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Build
        run: |
          cmake -S . -B build-pc -DCMAKE_C_FLAGS=-Werror
          cmake --build build-pc -j$(nproc)
      - name: Test
        run: ctest --test-dir build-pc --output-on-failure

  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check Python tools compile
        run: python3 -m py_compile tools/*.py re/scripts/*.py
